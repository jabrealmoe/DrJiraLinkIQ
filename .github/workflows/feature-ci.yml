name: Feature CI

on:
  push:
    branches:
      - 'feature/*'
      - 'fix/*'
      - 'chore/*'
  pull_request:
    branches:
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter (ESLint)
        run: npm run lint --if-present || npx eslint . --ext .js,.jsx,.ts,.tsx

      - name: Run unit tests with coverage
        run: npm test -- --coverage || npx jest --coverage
        
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

      - name: Run integration tests
        run: npm run test:integration --if-present

      - name: Install Forge CLI
        run: npm install -g @forge/cli

      - name: Forge login
        env:
          FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
          FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
        run: forge login --email $FORGE_EMAIL --token $FORGE_API_TOKEN --non-interactive

      - name: Run Forge Lint
        run: forge lint

      - name: Comment on PR with test results
        if: github.event_name == 'pull_request'
        uses: mshick/add-pr-comment@v2
        with:
          message: |
            ## CI Results
            ✅ **Linting**: Passed
            ✅ **Unit Tests**: Passed
            ✅ **Forge Lint**: Passed
            View the uploaded artifact for full coverage details.
